<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <style>
   path, circle {
      --basiccolor: var(--in-content-page-color,rgb(20,20,20));
      --fill: var(--basiccolor);
      --fill-opacity: 0.9;
   }

   @media (prefers-color-scheme: dark) {
